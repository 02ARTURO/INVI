<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto | Proinvi</title>
<meta name="description" content="Solicita tu cotización de tuberías, válvulas y conexiones industriales.">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="images/logo-proinvi.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contacto">

<main>
<section class="phero"><div class="wrap"><div class="crumb"><a href="index.html">Inicio</a> / Contacto</div><div class="eyebrow">Hablemos</div><h1>Solicita tu cotización</h1><p>Cuéntanos qué material necesitas, medidas y cantidades.</p></div></section>
<section class="sec" style="padding-top:30px"><div class="wrap split" style="align-items:start">
  <div class="box rv"><form class="form" id="cform">
    <div class="two"><label>Nombre<input name="nombre" required autocomplete="name"></label><label>Empresa<input name="empresa" autocomplete="organization"></label></div>
    <div class="two"><label>Correo<input name="email" type="email" required autocomplete="email"></label><label>Teléfono<input name="tel" type="tel" autocomplete="tel"></label></div>
    <label>Línea de interés<select name="interes"></select></label>
    <label>Mensaje<textarea name="mensaje" required placeholder="Material, medidas, cantidades…"></textarea></label>
    <input name="web" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
    <button class="btn p" type="submit" style="justify-content:center">Enviar solicitud <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><div id="cmsg"></div>
  </form></div>
  <div class="info rv" id="ci"></div>
</div></section>
</main>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
